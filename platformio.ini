; PlatformIO Project Configuration File
;
; M5Stack UnitCamS3 as a network camera: RTSP (MJPEG over RTP) + ONVIF Profile S
; Board settings are the same as the official UnitCamS3 user demo.
;
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-unitcams3]
platform = espressif32@6.9.0

; UnitCamS3 and esp32s3box use the same module (ESP32-S3, 16MB flash, 8MB octal PSRAM)
board = esp32s3box
framework = arduino

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0

monitor_filters = esp32_exception_decoder
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ~6.21.3
